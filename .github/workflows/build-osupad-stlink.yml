name: Build OSUpad ST-Link firmware

on:
  push:
    paths:
      - 'FIRMWARE/osupad_stlink/**'
      - '.github/workflows/build-osupad-stlink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build ST-Link firmware
        run: |
          cp -r FIRMWARE/osupad_stlink /qmk_firmware/keyboards/osupad_stlink
          qmk compile -kb osupad_stlink -km via

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: osupad-stlink-firmware
          path: /qmk_firmware/osupad_stlink_via.bin
          if-no-files-found: error

  clone-diagnostic:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build conservative clone diagnostic
        run: |
          cp -r FIRMWARE/osupad_stlink /qmk_firmware/keyboards/osupad_stlink_clone
          qmk compile -kb osupad_stlink_clone -km via -e LTO_ENABLE=no -e NKRO_ENABLE=no
          cp /qmk_firmware/osupad_stlink_clone_via.bin /qmk_firmware/osupad_stlink_clone_diagnostic.bin

      - name: Upload clone diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: osupad-stlink-clone-diagnostic
          path: /qmk_firmware/osupad_stlink_clone_diagnostic.bin
          if-no-files-found: error

  clone-msp-diagnostic:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build clone diagnostic using the main stack
        run: |
          cp -r FIRMWARE/osupad_stlink /qmk_firmware/keyboards/osupad_stlink_clone_msp
          qmk compile -kb osupad_stlink_clone_msp -km via -e LTO_ENABLE=no -e NKRO_ENABLE=no -e 'OPT_DEFS+=-DCRT0_CONTROL_INIT=0'
          cp /qmk_firmware/osupad_stlink_clone_msp_via.bin /qmk_firmware/osupad_stlink_clone_msp_diagnostic.bin

      - name: Upload main-stack clone diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: osupad-stlink-clone-msp-diagnostic
          path: /qmk_firmware/osupad_stlink_clone_msp_diagnostic.bin
          if-no-files-found: error
