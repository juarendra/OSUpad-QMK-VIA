name: Build OSUpad ST-Link firmware

on:
  push:
    paths:
      - 'FIRMWARE/osupad_stlink/**'
      - '.github/workflows/build-osupad-stlink.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build ST-Link firmware
        run: |
          cp -r FIRMWARE/osupad_stlink /qmk_firmware/keyboards/osupad_stlink
          qmk compile -kb osupad_stlink -km via -e 'EXTRAFLAGS=-DCRT0_CONTROL_INIT=0'

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: osupad-stlink-firmware
          path: /qmk_firmware/osupad_stlink_via.bin
          if-no-files-found: error

  clone-diagnostic:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build conservative clone diagnostic
        run: |
          cp -r FIRMWARE/osupad_stlink /qmk_firmware/keyboards/osupad_stlink_clone
          qmk compile -kb osupad_stlink_clone -km via -e LTO_ENABLE=no -e NKRO_ENABLE=no
          cp /qmk_firmware/osupad_stlink_clone_via.bin /qmk_firmware/osupad_stlink_clone_diagnostic.bin

      - name: Upload clone diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: osupad-stlink-clone-diagnostic
          path: /qmk_firmware/osupad_stlink_clone_diagnostic.bin
          if-no-files-found: error

  clone-msp-diagnostic:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build clone diagnostic using the main stack
        run: |
          cp -r FIRMWARE/osupad_stlink /qmk_firmware/keyboards/osupad_stlink_clone_msp
          qmk compile -kb osupad_stlink_clone_msp -km via -e LTO_ENABLE=no -e NKRO_ENABLE=no -e 'EXTRAFLAGS=-DCRT0_CONTROL_INIT=0'
          cp /qmk_firmware/osupad_stlink_clone_msp_via.bin /qmk_firmware/osupad_stlink_clone_msp_diagnostic.bin

      - name: Upload main-stack clone diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: osupad-stlink-clone-msp-diagnostic
          path: /qmk_firmware/osupad_stlink_clone_msp_diagnostic.bin
          if-no-files-found: error

  c6-usb-hid-probe:
    # This build uses QMK's STM32F103x6 STM32duino linker: 24 KiB application
    # flash after the bootloader and 10 KiB RAM. It is intentionally minimal
    # so a successful USB enumeration isolates the C6 memory layout from VIA
    # and RGB feature size.
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build STM32F103C6 USB-HID probe
        run: |
          cp -r FIRMWARE/osupad_c6_probe /qmk_firmware/keyboards/osupad_c6_probe
          qmk compile -kb osupad_c6_probe -km default -e 'EXTRAFLAGS=-DCRT0_CONTROL_INIT=0'

      - name: Upload STM32F103C6 USB-HID probe
        uses: actions/upload-artifact@v4
        with:
          name: osupad-c6-usb-hid-probe
          path: /qmk_firmware/osupad_c6_probe_default.bin
          if-no-files-found: error

  c6-stlink-usb-hid-probe:
    # The observed Arduino sketch is linked at 0x08000000, not behind a
    # bootloader. This variant has the same C6 memory limits but starts at the
    # reset address and is programmed through SWD.
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware
        run: qmk setup -y -H /qmk_firmware qmk/qmk_firmware

      - name: Build direct STM32F103C6 USB-HID probe
        run: |
          cp -r FIRMWARE/osupad_c6_stlink_probe /qmk_firmware/keyboards/osupad_c6_stlink_probe
          qmk compile -kb osupad_c6_stlink_probe -km default -e 'EXTRAFLAGS=-DCRT0_CONTROL_INIT=0'

      - name: Upload direct STM32F103C6 USB-HID probe
        uses: actions/upload-artifact@v4
        with:
          name: osupad-c6-stlink-usb-hid-probe
          path: /qmk_firmware/osupad_c6_stlink_probe_default.bin
          if-no-files-found: error

  c6-legacy-qmk-usb-hid-probe:
    # QMK 0.16.9 predates a reported STM32 USB enumeration regression. This
    # job tests its ChibiOS USBv1 driver against the same minimal direct-SWD
    # firmware before attempting a custom driver port.
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Set up QMK Firmware 0.16.9
        run: |
          git clone --depth 1 --branch 0.16.9 --recurse-submodules \
            https://github.com/qmk/qmk_firmware.git /qmk_firmware_0169

      - name: Build legacy STM32F103C6 USB-HID probe
        run: |
          cp -r FIRMWARE/osupad_c6_stlink_probe /qmk_firmware_0169/keyboards/osupad_c6_stlink_probe
          # 0.16.9 has no `custom` bootloader metadata. This only satisfies
          # its build validation; the local direct linker script still starts
          # the image at 0x08000000 and the board code does not request a
          # STM32duino bootloader.
          cp /qmk_firmware_0169/keyboards/osupad_c6_stlink_probe/rules_legacy.mk \
            /qmk_firmware_0169/keyboards/osupad_c6_stlink_probe/rules.mk
          rm /qmk_firmware_0169/keyboards/osupad_c6_stlink_probe/keyboard.json
          cp /qmk_firmware_0169/keyboards/osupad_c6_stlink_probe/config_legacy.h \
            /qmk_firmware_0169/keyboards/osupad_c6_stlink_probe/config.h
          # The legacy build system always injects its data-driven headers.
          # This probe deliberately uses only config.h because its modern
          # keyboard.json schema does not exist in QMK 0.16.9.  Pre-create
          # harmless empty generated headers so make does not call the old
          # generator with that missing schema.
          mkdir -p /qmk_firmware_0169/.build/obj_osupad_c6_stlink_probe/src
          touch /qmk_firmware_0169/.build/obj_osupad_c6_stlink_probe/src/info_config.h \
            /qmk_firmware_0169/.build/obj_osupad_c6_stlink_probe/src/default_keyboard.h \
            /qmk_firmware_0169/.build/obj_osupad_c6_stlink_probe/src/layouts.h
          qmk config user.qmk_home=/qmk_firmware_0169
          cd /qmk_firmware_0169
          # QMK 0.16.9 predates the current CLI's `hello` command. The
          # Makefile only uses it as an environment preflight, so bypass it
          # while retaining the compiler/toolchain supplied by the container.
          make osupad_c6_stlink_probe:default EXTRAFLAGS=-DCRT0_CONTROL_INIT=0 QMK_BIN=/bin/true

      - name: Upload legacy STM32F103C6 USB-HID probe
        uses: actions/upload-artifact@v4
        with:
          name: osupad-c6-legacy-qmk-usb-hid-probe
          path: /qmk_firmware_0169/osupad_c6_stlink_probe_default.bin
          if-no-files-found: error

  apm32-usb-keyboard-probe:
    # This is a hardware-identification probe, not the QMK firmware.  It
    # builds Geehy's APM32F103 USB Custom-HID keyboard example from the
    # vendor SDK at build time, so no vendor source is committed here.
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Check out OSUpad sources
        uses: actions/checkout@v4

      - name: Download and build APM32F103 USB keyboard probe
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive=/tmp/APM32F10x_SDK_V2.0.0.zip
          sdk_root=/tmp/apm32-sdk
          curl --fail --location --retry 3 \
            --output "$sdk_archive" \
            https://global.geehy.com/uploads/tool/APM32F10x_SDK_V2.0.0.zip
          # The vendor archive contains one non-ASCII filename whose local and
          # central-directory encodings disagree. unzip still extracts the SDK
          # correctly but returns status 1, so verify the required directory.
          unzip -q "$sdk_archive" -d "$sdk_root" || test -d "$sdk_root/APM32F10x_SDK_V2.0.0"

          sdk="$(find "$sdk_root" -maxdepth 1 -type d -name 'APM32F10x_SDK_*' | head -n 1)"
          test -n "$sdk"
          example="$sdk/Examples/Board_APM32F103_Mini/USB/Device_Examples/USBD_CUSTOM_HID_Keyboard"
          # The SDK examples target case-insensitive Windows filesystems. Fix
          # their board-header spelling only in this temporary SDK copy so GCC
          # on the Linux runner can resolve the same files.
          ln -s Board.h "$sdk/Boards/board.h"
          sed -i \
            -e 's#Board_APM32F103_MINI\\inc\\board_apm32f103_mini.h#Board_APM32F103_MINI/inc/Board_APM32F103_MINI.h#g' \
            -e 's#Board_APM32F103_MINI\\src\\board_apm32f103_mini.c#Board_APM32F103_MINI/src/Board_APM32F103_MINI.c#g' \
            "$sdk/Boards/Board.h" \
            "$sdk/Boards/Board.c" \
            "$sdk/Boards/Board_APM32F103_MINI/src/Board_APM32F103_MINI.c"
          # The vendor example defaults to its second USB controller. Test the
          # STM32F1-compatible USB1 peripheral used by the existing QMK build.
          sed -i 's/^#define USB_SELECT[[:space:]]*USB2/#define USB_SELECT                          USB1/' \
            "$example/Include/usbd_board.h"
          output_dir=/tmp/apm32-usb-keyboard-probe
          mkdir -p "$output_dir"

          includes=(
            "$example/Include"
            "$sdk/Middlewares/USB_Library/Device/Class/CustomHID/Inc"
            "$sdk/Middlewares/USB_Library/Device/Core/Inc"
            "$sdk/Boards"
            "$sdk/Boards/Board_APM32F103_MINI/inc"
            "$sdk/Libraries/APM32F10x_StdPeriphDriver/inc"
            "$sdk/Libraries/CMSIS/Include"
            "$sdk/Libraries/Device/Geehy/APM32F10x/Include"
          )
          include_flags=()
          for include in "${includes[@]}"; do
            include_flags+=("-I$include")
          done

          sources=(
            "$sdk/Boards/Board.c"
            "$sdk/Boards/Board_APM32F103_MINI/src/board_delay.c"
            "$example"/Source/*.c
            "$sdk"/Libraries/APM32F10x_StdPeriphDriver/src/*.c
            "$sdk"/Middlewares/USB_Library/Device/Core/Src/*.c
            "$sdk/Middlewares/USB_Library/Device/Class/CustomHID/Src/usbd_customhid.c"
            "$sdk/Libraries/Device/Geehy/APM32F10x/Source/gcc/startup_apm32f103xe.S"
          )

          arm-none-eabi-gcc \
            -mcpu=cortex-m3 -mthumb -mfloat-abi=soft \
            -Os -g3 -ffunction-sections -fdata-sections \
            -DAPM32F103xE -DAPM32F103_MINI \
            "${include_flags[@]}" \
            "${sources[@]}" \
            -T "$sdk/Libraries/Device/Geehy/APM32F10x/Source/gcc/apm32f103xe_flash.ld" \
            --specs=nano.specs --specs=nosys.specs \
            -Wl,--gc-sections,-Map,"$output_dir/apm32f103-usb1-keyboard-probe.map" \
            -o "$output_dir/apm32f103-usb1-keyboard-probe.elf"
          arm-none-eabi-objcopy -O binary \
            "$output_dir/apm32f103-usb1-keyboard-probe.elf" \
            "$output_dir/apm32f103-usb1-keyboard-probe.bin"
          arm-none-eabi-size "$output_dir/apm32f103-usb1-keyboard-probe.elf"

      - name: Upload APM32 USB keyboard probe
        uses: actions/upload-artifact@v4
        with:
          name: apm32f103-usb1-keyboard-probe
          path: /tmp/apm32-usb-keyboard-probe/apm32f103-usb1-keyboard-probe.bin
          if-no-files-found: error
